<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spread Helper</title>
    <style>
      /* Spread Helper v1.1.0 — neredeyse görünmez: tek satır "Spread Helper çalışıyor ●". Köprüsüz BAĞLA yalnız gerektiğinde tek düğme.
         Arka plan, yazı rengi ve yazı tipi Premiere'in CEP temasından (js/panel.js: getHostEnvironment().appSkinInfo); buradakiler
         yalnız tema okunamazsa. Başka bir panelin arkasında sekme olarak durabilir (en küçük boyut 60×20). */
      html, body { margin: 0; padding: 0; background: #232323; color: #d8d8d8; font-family: sans-serif; font-size: 11px; line-height: 1.4; }
      body { padding: 4px 8px; }
      .line { display: flex; align-items: center; cursor: pointer; white-space: nowrap; overflow: hidden; }
      #srv { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .dot { width: 7px; height: 7px; border-radius: 4px; margin-left: 6px; background: #8e8e8e; flex-shrink: 0; }
      .dot.ok { background: #2d9d78; }
      .dot.bad { background: #e34850; }
      .dot.warn { background: #e68619; }
      .bad { color: #e34850; }
      #bindbox { display: none; margin: 4px 0 0; }
      #btn-bind { display: none; padding: 0 10px; margin: 0 0 0 6px; flex-shrink: 0; }
      button { font: inherit; color: inherit; background: rgba(128, 128, 128, 0.18); border: 1px solid rgba(128, 128, 128, 0.45); border-radius: 12px; padding: 2px 12px; margin: 2px 4px 2px 0; cursor: pointer; }
      button.primary { background: #1473e6; border-color: #1473e6; color: #fff; font-weight: bold; }
      button:disabled { opacity: 0.5; cursor: default; }
      #results div { margin: 1px 0; }
      #more { display: none; margin: 8px 0 0; opacity: 0.85; }
      .row { margin: 2px 0; word-break: break-all; }
      textarea { width: 100%; box-sizing: border-box; height: 48px; font: 10px monospace; background: rgba(0, 0, 0, 0.15); color: inherit; border: 1px solid rgba(128, 128, 128, 0.45); }
      #log { white-space: pre-wrap; font: 10px/1.35 monospace; max-height: 140px; overflow: auto; margin-top: 4px; }
    </style>
  </head>
  <body>
    <!-- TEK satır: durum (ya da "Bağla bekliyor…" / son bağlamanın sonucu) + gerektiğinde Bağla düğmesi + nokta. Panel 60×20'ye
         küçültülse de bekleyen bağlama görünür (inceleme #9, m3). Tıklayınca ayrıntı. -->
    <div class="line"><span id="srv" title="Ayrıntı için tıkla">Spread Helper başlatılıyor…</span><button id="btn-bind" class="primary">Bağla</button><span id="dot" class="dot warn"></span></div>

    <!-- yalnız bu panelde bağladıktan sonra, sorunlu gruplar (panel yeterince yüksekse görünür; özet zaten durum satırında) -->
    <div id="bindbox">
      <div class="row" id="summary"></div>
      <div id="results"></div>
    </div>

    <!-- gizli ayrıntı: durum satırına tıklayınca -->
    <div id="more">
      <div class="row" id="ver"></div>
      <div class="row" id="env"></div>
      <div class="row" id="listen"></div>
      <div class="row">arka sekmede kalıcılık: <span id="persist">?</span></div>
      <div class="row">bilgi dosyası: <span id="info"></span></div>
      <div class="row">son istek: <span id="req"></span></div>
      <div class="row">plan: <span id="plan"></span></div>
      <div class="row">Planı yapıştır (plan dosyası okunamıyorsa: Spread → ⚙ Ayarlar → Durum raporu → Kopyala):</div>
      <textarea id="paste" placeholder="Spread'in KES planı (JSON)"></textarea>
      <button id="btn-bind2">Bağla</button><button id="btn-plan">Planı yeniden oku</button>
      <div id="log"></div>
    </div>

    <!-- sıra önemli: tek modül (Spread'in kendi kodu) → sunucu + BAĞLA mantığı → arayüz -->
    <script src="./js/spread-core.js"></script>
    <script src="./js/helper.js"></script>
    <script src="./js/panel.js"></script>
  </body>
</html>
